name: Build Windows Setup (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64

    - name: Install dependencies
      run: flutter pub get

    - name: Enable Windows desktop build
      run: flutter config --enable-windows-desktop

    - name: Build Windows release app
      run: flutter build windows --release

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup_script.iss

    - name: Upload Setup Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HappyDayPOS_Setup_Windows
        path: installer/output/HappyDayPOS_Setup.exe
